<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- GitHub Pages cannot send headers, so the CSP ships as a meta tag. connect-src allows
         https: because the API origin is runtime configuration (config.json). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https:; font-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <title>DevInsight</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="DevInsight analyses developers' GitHub codebases and visualises their development over time."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script src="theme-init.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
