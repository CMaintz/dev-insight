# There's no habit-hooks .NET sensor yet, so structural analysis comes from Roslyn
# analyzers in `typecheck` (`dotnet build -warnaserror`). habit-hooks contributes only
# the language-independent `generic` plugin — file-length (below) and, opt-in, jscpd.
plugins = ["generic"]

# Tests and generated EF Core migrations are not smell-scanned.
files = ["**/*.cs", "!**/*Tests/**", "!**/*Tests.cs", "!**/*.Test.cs", "!**/Migrations/**", "!**/bin/**", "!**/obj/**"]

# File-length: flag files over 300 lines (oversized-file) — Foundry's default for cohesive files.
[sensors.line-count]
args = ["--max", "300"]

# jscpd (the generic plugin's duplication detector) is a Node CLI. Disabled by default so
# the habits job stays Node-free (it runs only the pure-Python line-count). To turn on C#
# duplication detection: install Node + `npm i -g jscpd` in the smells job, copy
# ../jscpd.json to <repo>/.jscpd.json (jscpd ignores the `files` list above), delete this
# block, then re-seed the snooze baseline.
[sensors.jscpd]
disabled = true
