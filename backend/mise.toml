# Foundry verb interface — .NET backend. See https://github.com/CMaintz/foundry (CONTRACT.md).
# Callers run verbs (`mise run gate`), never the tools directly.

[tools]
dotnet = "10.0.402"

[env]
# habit-hooks (the structural-smell detector) is a pinned, mise-managed pip tool, provisioned
# into a per-plugin venv by setup:habit-hooks (postinstall) whose bin goes on PATH below - so
# the SAME version runs in-loop, pre-push (`gate`) and in CI. The `dotnet` sensor owns the
# structural smells (oversized-function, high-complexity, too-many-parameters, oversized-file):
# it builds DevInsight.slnx with SonarAnalyzer.CSharp active and ratchets the warnings via the
# snooze baseline; the bundled `generic` sensor adds file-length. Core + both plugins pin to
# this one version (the dotnet plugin depends only on core, so generic is pinned explicitly).
HABIT_HOOKS_VERSION = "1.5.0"
HABIT_HOOKS_PLUGIN = "foundry-habit-hooks-dotnet"
# The Foundry gate script (foundry-verb-wrap) is provisioned by setup:foundry-scripts into a
# cache dir at this ref, not vendored (see that task). Renovate tracks the pin via the comment.
# renovate: datasource=github-tags depName=CMaintz/foundry
FOUNDRY_SCRIPTS_REF = "v2.12.0"
# The foundry-scripts cache first (so `gate` runs `foundry-verb-wrap` by name); then the repo's
# own scripts/ (foundry-loop-report, ruleset_guard.py, setup-azure.sh); then the habit-hooks
# venv bin (Linux `bin/`, Windows `Scripts/` - the absent one is ignored) so `smells` finds the
# pinned habit-hooks.
_.path = [
    "{{env.HOME}}/.local/opt/foundry-scripts-{{env.FOUNDRY_SCRIPTS_REF}}",
    "{{config_root}}/../scripts",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/Scripts",
]
FOUNDRY_TELEMETRY = "{{config_root}}/../.foundry/telemetry.jsonl"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_NOLOGO = "1"

[hooks]
# Provision the pinned habit-hooks and the cached Foundry gate script on `mise install`
# (local and CI alike). Array form runs them in order.
postinstall = ["mise run setup:habit-hooks", "mise run setup:foundry-scripts"]

[tasks.fix]
description = "Auto-format (dotnet format)"
run = "dotnet format DevInsight.slnx"

[tasks.lint]
description = "Formatting, code style and naming rules (.editorconfig) + structural smells"
# `dotnet format --verify-no-changes` is the style check; `mise run smells` runs the habit-hooks
# dotnet sensor (SonarAnalyzer structural warnings) + the generic file-length check, ratcheted
# against the snooze baseline - the same smell scan CI runs. The sensor owns the structural
# smells; typecheck owns compile/CA/audit.
run = ["dotnet format DevInsight.slnx --verify-no-changes", "mise run smells"]

# Provision the pinned habit-hooks (core + dotnet sensor + generic, same version) into a
# per-plugin venv. Auxiliary - not a contract verb, run via postinstall on `mise install`.
[tasks."setup:habit-hooks"]
description = "Install the pinned habit-hooks + dotnet sensor + generic into a venv"
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
py=""
for c in python3 python; do
  if command -v "$c" >/dev/null 2>&1 && "$c" --version >/dev/null 2>&1; then py="$c"; break; fi
done
if [ -z "$py" ]; then echo "setup:habit-hooks: no working python3/python on PATH; skipping (install Python to run smells)"; exit 0; fi
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
if "$bin/habit-hooks" --version >/dev/null 2>&1; then exit 0; fi
echo "Installing $HABIT_HOOKS_PLUGIN + habit-hooks $HABIT_HOOKS_VERSION -> $dst"
rm -rf "$dst"
"$py" -m venv "$dst"
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
# generic pinned explicitly for lockstep: the dotnet plugin depends only on core, and core's
# generic dependency is a range that could resolve off the pinned version.
"$bin/pip" install --disable-pip-version-check "habit-hooks==$HABIT_HOOKS_VERSION" "$HABIT_HOOKS_PLUGIN==$HABIT_HOOKS_VERSION" "habit-hooks-generic==$HABIT_HOOKS_VERSION"
'''

# Fetch the pinned Foundry gate script into a cache dir, rather than vendoring a copy into
# the repo (agent/CI plumbing, not the repo's code; a vendored copy drifts and needs a
# re-sync on every bump). Pinned to FOUNDRY_SCRIPTS_REF, provisioned once via postinstall.
# Offline-safe: no network call when every script is already cached at this ref, so the
# gate hot path never depends on the network; a ref bump needs the network once.
[tasks."setup:foundry-scripts"]
description = "Fetch the pinned Foundry gate script into a cache dir (de-vendored)"
run = '''
set -eu
dst="$HOME/.local/opt/foundry-scripts-$FOUNDRY_SCRIPTS_REF"
scripts="foundry-verb-wrap"
need=""
for s in $scripts; do [ -f "$dst/$s" ] || need="$need $s"; done
[ -z "$need" ] && exit 0
mkdir -p "$dst"
base="https://raw.githubusercontent.com/CMaintz/foundry/$FOUNDRY_SCRIPTS_REF/scripts"
for s in $need; do
  if ! curl -fsSL "$base/$s" -o "$dst/$s.part"; then
    echo "setup:foundry-scripts: cannot fetch $s at $FOUNDRY_SCRIPTS_REF (network needed once per ref)" >&2
    rm -f "$dst/$s.part"; exit 1
  fi
  mv "$dst/$s.part" "$dst/$s"
  chmod +x "$dst/$s" 2>/dev/null || true
done
'''

# Structural smells on changed files (habit-hooks --branch), folded into `lint`. Degrades
# gracefully (skip) with no .habit-hooks config/snooze or an unresolvable base; FAILS only when
# a config + baseline exist but habit-hooks isn't on PATH (run `mise install`).
[tasks.smells]
description = "Structural smells on changed files (habit-hooks --branch); folded into lint"
depends = ["setup:habit-hooks"]
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
hh="$dst/bin/habit-hooks"; [ -x "$hh" ] || hh="$dst/Scripts/habit-hooks.exe"
if [ ! -f .habit-hooks/config.toml ]; then echo "smells: no .habit-hooks/config.toml; skipping"; exit 0; fi
if [ ! -f .habit-hooks/snooze.json ]; then m="smells: no snooze baseline yet (run bootstrap); structural smells are NOT being checked"; echo "$m"; if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::warning::$m"; fi; exit 0; fi
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "smells: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
[ -x "$hh" ] || { echo "smells: pinned habit-hooks not found at $dst (run 'mise install')" >&2; exit 1; }
echo "smells: $("$hh" --version) --branch base=$mb"
"$hh" --branch "$mb"
'''

[tasks.typecheck]
description = "Compile + Roslyn analyzers + NuGet audit, warnings as errors"
run = "dotnet build DevInsight.slnx -warnaserror"

[tasks.test]
description = "All test projects + merged line-coverage floor (needs Docker or DEVINSIGHT_TEST_POSTGRES for the API tests)"
# coverlet.MTP has no threshold option yet, so the reports are merged with ReportGenerator
# and the floor is checked here. Coverage counts DevInsight.* only; EF migrations are generated.
run = '''
set -eu
floor=85
rm -rf TestResults
dotnet test --solution DevInsight.slnx --no-build --results-directory "$PWD/TestResults" \
  --coverlet --coverlet-output-format cobertura --coverlet-include "[DevInsight.*]*" \
  --coverlet-exclude-by-file "**/Migrations/*.cs"
dotnet tool restore > /dev/null
dotnet reportgenerator "-reports:TestResults/coverage.cobertura.*.xml" "-targetdir:TestResults/report" \
  -reporttypes:TextSummary > /dev/null
line=$(grep -m1 "Line coverage:" TestResults/report/Summary.txt | grep -o "[0-9.]*" | head -1)
echo "Line coverage: ${line}% (floor ${floor}%)"
awk -v l="$line" -v f="$floor" 'BEGIN { exit !(l >= f) }' || { echo "Coverage is below the ${floor}% floor."; exit 1; }
'''

[tasks.audit]
description = "Vulnerable NuGet packages, including transitive ones"
# `dotnet list --vulnerable` exits 0 even with findings, so fail when the report names one —
# and fail too if the listing itself fails, so a broken audit can never pass silently.
run = '''
set -eu
report=$(dotnet list DevInsight.slnx package --vulnerable --include-transitive 2>&1) || { echo "$report"; exit 1; }
if echo "$report" | grep -q 'has the following vulnerable'; then echo "$report"; exit 1; fi
echo "No vulnerable packages."
'''

[tasks.gate]
description = "The oracle: lint -> typecheck -> test -> audit, sequentially."
# The setup:foundry-scripts dep provisions the cached gate script first (idempotent) - it
# matters for a local root `mise run gate`, where a root `mise install` never fires this
# package's postinstall. The verbs stay sequential (never `depends`, which mise runs in parallel).
depends = ["setup:foundry-scripts"]
run = [
    "foundry-verb-wrap lint      -- mise run lint",
    "foundry-verb-wrap typecheck -- mise run typecheck",
    "foundry-verb-wrap test      -- mise run test",
    "foundry-verb-wrap audit     -- mise run audit",
]
