# gitleaks config for the Foundry security workflow's secret scan.
#
# CRITICAL: secrets are NOT ratcheted. A real leaked secret is remediated
# (rotate, then purge from history), never allowlisted. Only add a path here once
# you've CONFIRMED the finding is not a real secret — e.g. public-by-design
# config, or a dummy test fixture. Prefer exact file paths over directories.
title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Confirmed non-secrets only."
paths = [
  # Integration-test host only: a plain-text dummy JWT signing key ("integration-test-signing-key-…"),
  # used to sign tokens inside WebApplicationFactory. Not a credential for anything real.
  '''^backend/tests/DevInsight\.Api\.Tests/ApiFactory\.cs$''',
]
