# Regenerates each package's habit-hooks snooze baseline on Linux and opens a PR (prune-only once it exists).
name: bootstrap
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'
jobs:
  backend:
    uses: CMaintz/foundry/.github/workflows/bootstrap.yml@664443a5d900c46353343c56ca8404954a0f8d63 # v2.13.0
    secrets:
      app_private_key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
    with:
      working_directory: backend
      habit_hooks_plugin: foundry-habit-hooks-dotnet
      app_client_id: ${{ vars.BOOTSTRAP_APP_CLIENT_ID }}
    permissions: { contents: write, pull-requests: write }
  frontend:
    uses: CMaintz/foundry/.github/workflows/bootstrap.yml@664443a5d900c46353343c56ca8404954a0f8d63 # v2.13.0
    secrets:
      app_private_key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
    with:
      working_directory: frontend
      habit_hooks_plugin: habit-hooks-typescript
      app_client_id: ${{ vars.BOOTSTRAP_APP_CLIENT_ID }}
    permissions: { contents: write, pull-requests: write }
