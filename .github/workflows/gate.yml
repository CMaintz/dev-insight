# Foundry gate (https://github.com/CMaintz/foundry): the same six verbs as `mise run gate`, per package.
# Pinned to Foundry v2.9.0. Require both `gate-ok` checks in branch protection.
name: gate
on: { pull_request: {}, push: { branches: [main] } }
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  backend:
    uses: CMaintz/foundry/.github/workflows/gate.yml@bc980e81bda32af3ef04b8149badf9529c3e6e84 # v2.9.0
    with:
      stack: dotnet
      working_directory: backend
      # The dotnet structural-smell sensor (the stack default at v2.9.0, set explicitly for
      # clarity). The gate job and the backstop job both build it with the .NET SDK + venv.
      habit_hooks_plugin: foundry-habit-hooks-dotnet
  frontend:
    uses: CMaintz/foundry/.github/workflows/gate.yml@bc980e81bda32af3ef04b8149badf9529c3e6e84 # v2.9.0
    with:
      stack: ts
      working_directory: frontend
