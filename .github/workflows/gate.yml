# Foundry gate (https://github.com/CMaintz/foundry): the same six verbs as `mise run gate`, per package.
# Pinned to Foundry v2.3.0 (first release with the .NET stack and the security-facade fix). Require both
# `gate-ok` checks in branch protection.
name: gate
on: { pull_request: {}, push: { branches: [main] } }
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  backend:
    uses: CMaintz/foundry/.github/workflows/gate.yml@2112a422a905c329602701d7a0a40fbdb5b91a19 # v2.5.1
    with:
      stack: dotnet
      working_directory: backend
  frontend:
    uses: CMaintz/foundry/.github/workflows/gate.yml@2112a422a905c329602701d7a0a40fbdb5b91a19 # v2.5.1
    with:
      stack: ts
      working_directory: frontend
