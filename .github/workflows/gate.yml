# Foundry gate (https://github.com/CMaintz/foundry): the same six verbs as `mise run gate`, per package.
# Pinned to Foundry v2.8.0. Require both `gate-ok` checks in branch protection.
name: gate
on: { pull_request: {}, push: { branches: [main] } }
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  backend:
    uses: CMaintz/foundry/.github/workflows/gate.yml@ad286d83af4094a74c3a0ff7b0390a14d88ba801 # v2.8.0
    with:
      stack: dotnet
      working_directory: backend
      # The dotnet structural-smell sensor; enforced via the gate job's folded `lint`
      # (mise run smells), which has the .NET SDK + venv from the repo's backend/mise.toml.
      habit_hooks_plugin: foundry-habit-hooks-dotnet
      # The dedicated backstop job at v2.8.0 is pip-only with no .NET SDK, so it cannot build
      # the sensor; the folded smells in `lint` cover it. Re-enable once the ref is past
      # foundry#78 (which reworks that job to mise + the SDK).
      habit_hooks: false
  frontend:
    uses: CMaintz/foundry/.github/workflows/gate.yml@ad286d83af4094a74c3a0ff7b0390a14d88ba801 # v2.8.0
    with:
      stack: ts
      working_directory: frontend
