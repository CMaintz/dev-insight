# Build the Angular SPA for https://cmaintz.github.io/DevInsight/ and publish it to GitHub Pages.
# Required repository variable: DEVINSIGHT_API_URL (the Container App URL, e.g. https://ca-devinsight-api.<env>.azurecontainerapps.io).
name: deploy-pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch: {}

concurrency: { group: pages, cancel-in-progress: false }

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip (instead of failing) until scripts/setup-azure.sh has set the API URL.
    if: vars.DEVINSIGHT_API_URL != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          install_args: node
      - run: npm ci --no-audit --no-fund
      - run: npm run build:pages
      - name: Point the SPA at the API (runtime config, no rebuild needed to change it)
        env:
          API_URL: ${{ vars.DEVINSIGHT_API_URL }}
        run: |
          test -n "$API_URL" || { echo "::error::Set the DEVINSIGHT_API_URL repository variable"; exit 1; }
          printf '{ "apiBaseUrl": "%s" }\n' "$API_URL" > dist/devinsight/browser/config.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist/devinsight/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
